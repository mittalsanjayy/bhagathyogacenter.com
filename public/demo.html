<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123b30">

  <title>Book a Free Yoga Demo | Bhagath Yoga Center</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="demo.css">
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" defer></script>
  <script src="emailjs-config.js" defer></script>
</head>

<body>

  <header class="demo-header">


<a href="index.html" class="demo-back-link">
  <img src="assets/logo.jpeg" alt="Bhagath Yoga Center Logo" class="demo-logo">

  <span class="brand-text">BHAGATH YOGA CENTER</span>
</a>

<span class="back-divider"></span>

<a href="index.html" class="back-label">← Back to Home</a>


  </header>

  <main class="booking-container">


<section class="booking-card">

  <div class="decorative-symbol">✧</div>

  <p class="eyebrow">A COMPLIMENTARY EXPERIENCE</p>

  <h1>
    Your journey<br>
    <em>begins here.</em>
  </h1>

  <p class="intro">
    Take the first step towards a healthier, calmer and more balanced life.
    Book your complimentary yoga session with us.
  </p>


  <form id="demoForm">

    <div class="form-group">
      <label for="name">Your Full Name</label>
      <input
        type="text"
        id="name"
        name="name"
        autocomplete="name"
        placeholder="Enter your name"
        minlength="2"
        required
      >
    </div>


    <div class="form-group">
      <label for="phone">Mobile Number</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="Enter your 10-digit mobile number"
        inputmode="numeric"
        pattern="[6-9][0-9]{9}"
        autocomplete="tel"
        maxlength="10"
        required
      >
    </div>


    <div class="form-group">
      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        name="email"
        autocomplete="email"
        placeholder="Enter your email address"
        required
      >
    </div>


    <div class="form-group">
      <label for="date">Preferred Date</label>
      <input
        type="date"
        id="date"
        name="preferred_date"
        required
      >
    </div>


    <div class="form-group">
      <label for="time">Choose Your Preferred Time</label>

      <select id="time" name="preferred_time" required>
        <option value="">Select a yoga session</option>
        <option value="6:00 AM - 7:00 AM">6:00 AM – 7:00 AM</option>
        <option value="7:00 AM - 8:00 AM">7:00 AM – 8:00 AM</option>
        <option value="8:30 AM - 9:30 AM">8:30 AM – 9:30 AM</option>
        <option value="10:30 AM - 11:30 AM">10:30 AM – 11:30 AM</option>
        <option value="5:00 PM - 6:00 PM">5:00 PM – 6:00 PM</option>
        <option value="7:00 PM - 8:00 PM">7:00 PM – 8:00 PM</option>
      </select>
    </div>

    <div class="form-group">
      <label for="message">Your message</label>
      <textarea
        id="message"
        name="message"
        rows="3"
        minlength="5"
        placeholder="Anything you would like us to know?"
        required
      ></textarea>
    </div>

    <button type="submit" id="submitButton">
      Request Free Demo
      <span>↗</span>
    </button>

  </form>


  <div id="confirmation" role="status" aria-live="polite" hidden></div>

  <p class="note">
    ✦ 100% FREE &nbsp; · &nbsp; NO PAYMENT REQUIRED &nbsp; · &nbsp; BEGINNER FRIENDLY
  </p>

</section>


  </main>

  <script src="demo.js" defer></script>

</body>
</html>
